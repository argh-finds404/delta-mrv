services:
  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    environment:
      POSTGRES_USER: delta
      POSTGRES_PASSWORD: delta_local
      POSTGRES_DB: delta
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep PGDATA at /var/lib/postgresql/18/docker, so the
      # volume mounts one level up; mounting .../data would not persist anything.
      - delta-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delta -d delta"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  delta-pgdata:

# Local URL for both DATABASE_URL and DATABASE_URL_UNPOOLED:
#   postgresql://delta:delta_local@localhost:5432/delta
